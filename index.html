<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CloudPilled — AWS Cloud Practitioner study app</title>
    <meta name="description" content="Exam-aligned study app for the AWS Certified Cloud Practitioner (CLF-C02): lessons, practice questions, smart flashcards, and mock exams. No account needed." />
    <meta name="theme-color" content="#f5f2ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1224" media="(prefers-color-scheme: dark)" />
    <link rel="canonical" href="https://cloud-pilled.vercel.app/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="CloudPilled" />

    <!-- Link previews (iMessage, Slack, Discord, X, LinkedIn). These URLs must be absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CloudPilled" />
    <meta property="og:title" content="CloudPilled — Learn the cloud. Pass the exam." />
    <meta property="og:description" content="Lessons, practice, smart flashcards, and mock exams for the AWS Certified Cloud Practitioner (CLF-C02)." />
    <meta property="og:url" content="https://cloud-pilled.vercel.app/" />
    <meta property="og:image" content="https://cloud-pilled.vercel.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CloudPilled: a flashcard for Amazon DynamoDB next to the headline “Learn the cloud. Pass the exam.”" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CloudPilled — Learn the cloud. Pass the exam." />
    <meta name="twitter:description" content="Lessons, practice, smart flashcards, and mock exams for the AWS Certified Cloud Practitioner (CLF-C02)." />
    <meta name="twitter:image" content="https://cloud-pilled.vercel.app/og-image.png" />

    <script>
      // Apply the saved theme before first paint to avoid a flash.
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('cloudpilled:v2') || 'null');
          var pref = (s && s.prefs && s.prefs.theme) || 'system';
          var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>CloudPilled needs JavaScript to run. It has no server and sends nothing anywhere.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
