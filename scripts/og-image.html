<!doctype html>
<!--
  Source for public/og-image.png (the link-preview card shown by iMessage, Slack, Discord, X, LinkedIn).
  Render at exactly 1200x630. With Playwright:
    page.setViewportSize({ width: 1200, height: 630 }); page.goto('file:///…/scripts/og-image.html'); page.screenshot({ path: 'public/og-image.png' })
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Bricolage'; src: url('../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wght-normal.woff2'); font-weight: 200 800; }
  @font-face { font-family: 'Inter'; src: url('../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2'); font-weight: 100 900; }
  @font-face { font-family: 'Mono'; src: url('../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2'); font-weight: 100 800; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Inter', sans-serif; color: #15182e; position: relative;
    background:
      radial-gradient(760px 420px at 100% 0%, rgba(51, 64, 217, 0.16), transparent 70%),
      radial-gradient(640px 380px at 0% 0%, rgba(255, 90, 60, 0.14), transparent 70%),
      #f5f2ea;
  }
  .left { position: absolute; left: 72px; top: 64px; width: 600px; height: 502px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand svg { width: 76px; height: 76px; color: #3340d9; }
  .brand b { font-family: 'Bricolage'; font-weight: 800; font-size: 46px; letter-spacing: -0.03em; }
  .v3 { font-family: 'Mono'; font-weight: 600; font-size: 20px; padding: 4px 12px; border-radius: 999px; background: #ffe6df; color: #b52f15; align-self: flex-start; margin-top: 8px; }
  h1 { font-family: 'Bricolage'; font-weight: 800; font-size: 74px; line-height: 1.02; letter-spacing: -0.04em; margin-top: 54px; }
  h1 span { color: #3340d9; }
  p.sub { margin-top: 26px; font-size: 27px; line-height: 1.4; color: #3d4259; max-width: 560px; }
  .foot { margin-top: auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .chip { font-family: 'Mono'; font-weight: 600; font-size: 19px; padding: 7px 14px; border-radius: 999px; }
  .c1 { background: #e1edfb; color: #164f9c; } .c2 { background: #ece5fb; color: #54249f; }
  .c3 { background: #dbf2ef; color: #07584f; } .c4 { background: #fbecd0; color: #7a4600; }
  .exam { font-family: 'Mono'; font-weight: 600; font-size: 19px; color: #575c77; margin-left: 6px; }

  .stage { position: absolute; right: 40px; top: 56px; width: 470px; height: 520px; }
  .card { position: absolute; border-radius: 28px; background: #fffdf8; border: 2px solid #c9c0a8; box-shadow: 0 30px 60px rgba(21, 24, 46, 0.18), 0 6px 14px rgba(21, 24, 46, 0.08); }
  .back-card { width: 400px; height: 440px; right: 6px; top: 22px; transform: rotate(7deg); background: #e4e6fb; border-color: #b9bff4; }
  .front-card {
    width: 400px; height: 440px; left: 0; top: 40px; transform: rotate(-3deg); border-top: 9px solid #0b857a; overflow: hidden;
    background: radial-gradient(420px 220px at 100% 0%, rgba(11, 133, 122, 0.18), transparent 70%), #fffdf8;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 36px; gap: 18px;
  }
  .tag { font-family: 'Mono'; font-weight: 600; font-size: 17px; letter-spacing: 0.1em; text-transform: uppercase; padding: 6px 16px; border-radius: 999px; background: #dbf2ef; color: #07584f; }
  .name { font-family: 'Bricolage'; font-weight: 800; font-size: 50px; line-height: 1.04; letter-spacing: -0.03em; }
  .q { font-size: 21px; color: #575c77; max-width: 280px; line-height: 1.4; }
  .hint { position: absolute; bottom: 22px; font-size: 17px; color: #575c77; }
  .rate { position: absolute; left: 22px; bottom: 6px; display: flex; gap: 10px; transform: rotate(-3deg); }
  .rate i { font-style: normal; font-family: 'Bricolage'; font-weight: 700; font-size: 20px; padding: 12px 20px; border-radius: 16px; background: #fffdf8; border: 2px solid #c9c0a8; box-shadow: 0 10px 22px rgba(21, 24, 46, 0.12); }
  .rate i:nth-child(1) { color: #b3261e; } .rate i:nth-child(4) { color: #14774a; }
  .ring { position: absolute; right: -6px; bottom: 54px; width: 148px; height: 148px; border-radius: 50%; background: #fffdf8; border: 2px solid #c9c0a8; box-shadow: 0 20px 40px rgba(21, 24, 46, 0.18); display: grid; place-items: center; transform: rotate(4deg); }
  .ring svg { position: absolute; inset: 10px; width: 128px; height: 128px; transform: rotate(-90deg); }
  .ring b { font-family: 'Bricolage'; font-weight: 800; font-size: 40px; letter-spacing: -0.03em; position: relative; line-height: 1; text-align: center; }
  .ring b small { display: block; font-family: 'Inter'; font-weight: 600; font-size: 15px; color: #575c77; letter-spacing: 0; margin-top: 4px; }
</style>
</head>
<body>
  <div class="left">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><g transform="rotate(-35 16 16)"><rect x="3.5" y="9.5" width="25" height="13" rx="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M16 9.5h6a6.5 6.5 0 0 1 0 13h-6z" fill="#ff5a3c"/></g></svg>
      <b>CloudPilled</b><span class="v3">v3</span>
    </div>
    <h1>Learn the cloud.<br /><span>Pass the exam.</span></h1>
    <p class="sub">Lessons, practice, smart flashcards, and mock exams for the AWS Certified Cloud Practitioner.</p>
    <div class="foot">
      <span class="chip c1">Concepts</span><span class="chip c2">Security</span><span class="chip c3">Services</span><span class="chip c4">Billing</span>
      <span class="exam">CLF-C02</span>
    </div>
  </div>

  <div class="stage">
    <div class="card back-card"></div>
    <div class="card front-card">
      <span class="tag">Database</span>
      <div class="name">Amazon<br />DynamoDB</div>
      <div class="q">What does it do, and when would you pick it?</div>
      <div class="hint">Tap to reveal</div>
    </div>
    <div class="rate"><i>Again</i><i>Hard</i><i>Good</i><i>Easy</i></div>
    <div class="ring">
      <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="#f1ede2" stroke-width="10"/><circle cx="50" cy="50" r="40" fill="none" stroke="#0b857a" stroke-width="10" stroke-linecap="round" stroke-dasharray="251.3" stroke-dashoffset="90"/></svg>
      <b>64%<small>accuracy</small></b>
    </div>
  </div>
</body>
</html>
