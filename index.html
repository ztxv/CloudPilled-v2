<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="CloudPilled v3: an exam-aligned study app for the AWS Certified Cloud Practitioner (CLF-C02). Lessons, practice, mock exams, and progress that stays on your device." />
    <meta name="theme-color" content="#f5f2ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1224" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>CloudPilled v3 — AWS Cloud Practitioner study app</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('cloudpilled:v2') || 'null');
          var pref = (s && s.prefs && s.prefs.theme) || 'system';
          var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>CloudPilled needs JavaScript to run. It has no server and sends nothing anywhere.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
